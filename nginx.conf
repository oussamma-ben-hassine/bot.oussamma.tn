# Configuration Nginx Reverse Proxy pour bot.oussamma.tn

server {
    listen 80;
    server_name bot.oussamma.tn;

    # Redirection HTTP vers HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bot.oussamma.tn;

    # Certificats SSL (ex: Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/bot.oussamma.tn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.oussamma.tn/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Proxy vers le container bot-oussamma
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Headers WebSocket & SSE Streaming
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Configuration critique pour le streaming SSE (Server-Sent Events)
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
